# Render blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: prediction-hub
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: FOOTBALL_DATA_KEY
        sync: false # you paste the key in Render's dashboard; it is never stored in the repo
